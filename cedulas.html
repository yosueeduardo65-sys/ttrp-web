<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tierra Tica RP - Cédulas Creadas</title>
    <style>
        :root {
            --cr-blue: #002b7f;
            --cr-red: #ce1126;
            --bg-dark: #070b14;
            --card-border: rgba(255, 255, 255, 0.1);
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .tricolor-bar { height: 4px; width: 100%; background: linear-gradient(90deg, #0284c7 0% 30%, #ffffff 30% 45%, #e11d48 45% 55%, #ffffff 55% 70%, #0284c7 70% 100%); }

        header {
            background: #0b1120;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .header-title { font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem; }

        .btn-nav {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 600;
        }

        main { flex: 1; padding: 2rem 1.5rem; max-width: 1000px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 1.5rem; }

        .counter-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .counter-number span { font-size: 2.2rem; font-weight: 800; color: #38bdf8; }

        .search-bar input {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .cedulas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 1.5rem;
        }

        @media (max-width: 480px) {
            .cedulas-grid { grid-template-columns: 1fr; }
        }

        .cedula-card {
            background: linear-gradient(145deg, #061836 0%, #030d21 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 1.25rem 1.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .cedula-card::before, .cedula-card::after {
            content: '';
            position: absolute;
            left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #002b7f 0% 30%, #ffffff 30% 45%, #ce1126 45% 55%, #ffffff 55% 70%, #002b7f 70% 100%);
        }
        .cedula-card::before { top: 0; }
        .cedula-card::after { bottom: 0; }

        .cedula-header { display: flex; justify-content: space-between; align-items: center; }
        .cedula-title-box { display: flex; align-items: center; gap: 0.6rem; }

        .shield-icon {
            width: 32px; height: 32px; border-radius: 50%;
            border: 2px solid #38bdf8; display: flex;
            align-items: center; justify-content: center; font-size: 0.85rem;
        }

        .rep-title { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; font-weight: 700; }
        .doc-title { font-size: 1rem; font-weight: 900; color: #fff; }

        .badge-activa {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981; color: #34d399;
            font-size: 0.7rem; font-weight: 800; padding: 0.25rem 0.75rem;
            border-radius: 99px;
        }

        .cedula-body { display: flex; gap: 1.25rem; align-items: flex-start; margin-top: 0.2rem; }

        .photo-box {
            width: 85px;
            height: 95px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            font-size: 2rem;
            flex-shrink: 0;
            overflow: hidden;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .main-info { display: flex; flex-direction: column; gap: 0.4rem; }
        .field-label { font-size: 0.65rem; text-transform: uppercase; color: #64748b; font-weight: 700; }
        .field-value-main { font-size: 1.1rem; font-weight: 900; color: #fff; text-transform: uppercase; }
        .field-value-id { font-size: 0.95rem; font-weight: 800; color: #f59e0b; }

        .cedula-grid-fields {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 0.6rem 1rem; margin-top: 0.2rem;
        }

        .field-item { display: flex; flex-direction: column; }
        .field-val { font-size: 0.85rem; font-weight: 700; color: #e2e8f0; }

        .mrz-line {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 0.5rem; display: flex;
            justify-content: space-between; font-family: monospace;
            font-size: 0.65rem; color: #475569;
        }

        .empty-msg { text-align: center; color: var(--text-muted); padding: 3rem; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div class="tricolor-bar"></div>

    <header>
        <div class="header-title"><span>🇨🇷</span> REGISTRO DE CÉDULAS</div>
        <div style="display: flex; gap: 0.5rem;">
            <a href="crear-cedula.html" class="btn-nav" style="background: #e11d48; border: none;">+ Crear Cédula</a>
            <a href="principal.html" class="btn-nav">← Panel</a>
        </div>
    </header>

    <main>
        <div class="counter-card">
            <div>
                <h2>Base de Datos de Cédulas</h2>
                <p style="color: #94a3b8; font-size: 0.85rem;">Documentos oficiales emitidos en Tierra Tica RP.</p>
            </div>
            <div class="counter-number">
                <span id="numTotal">0</span>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="inputFilter" placeholder="🔍 Buscar por Nombre, N.° Cédula, Usuario Roblox o Discord...">
        </div>

        <div class="cedulas-grid" id="containerCedulas"></div>
    </main>

    <script>
        const container = document.getElementById('containerCedulas');
        const numTotalEl = document.getElementById('numTotal');
        const inputFilter = document.getElementById('inputFilter');

        function obtenerCedulas() {
            const data = localStorage.getItem('tierra_tica_cedulas');
            return data ? JSON.parse(data) : [];
        }

        function renderizar(query = '') {
            const cedulas = obtenerCedulas();
            numTotalEl.textContent = cedulas.length;

            const filtradas = cedulas.filter(c => 
                (c.nombre && c.nombre.toLowerCase().includes(query.toLowerCase())) ||
                (c.cedula && c.cedula.includes(query)) ||
                (c.user && c.user.toLowerCase().includes(query.toLowerCase())) ||
                (c.discord && c.discord.toLowerCase().includes(query.toLowerCase()))
            );

            if (filtradas.length === 0) {
                container.innerHTML = `<div class="empty-msg">No hay cédulas creadas todavía.</div>`;
                return;
            }

            container.innerHTML = filtradas.map(c => `
                <div class="cedula-card">
                    <div class="cedula-header">
                        <div class="cedula-title-box">
                            <div class="shield-icon">🛡️</div>
                            <div>
                                <div class="rep-title">REPÚBLICA DE TIERRA TICA RP</div>
                                <div class="doc-title">CÉDULA DE IDENTIDAD</div>
                            </div>
                        </div>
                        <div class="badge-activa">ACTIVA</div>
                    </div>

                    <div class="cedula-body">
                        <div class="photo-box">
                            ${c.foto ? `<img src="${c.foto}" alt="Foto de Cédula">` : '☝️'}
                        </div>
                        <div class="main-info">
                            <div>
                                <div class="field-label">NOMBRE</div>
                                <div class="field-value-main">${c.nombre || 'N/A'}</div>
                            </div>
                            <div>
                                <div class="field-label">N.º CÉDULA</div>
                                <div class="field-value-id">${c.cedula || 'N/A'}</div>
                            </div>
                        </div>
                    </div>

                    <div class="cedula-grid-fields">
                        <div class="field-item">
                            <span class="field-label">USUARIO ROBLOX</span>
                            <span class="field-val">@${c.user || 'N/A'}</span>
                        </div>
                        <div class="field-item">
                            <span class="field-label">PROVINCIA</span>
                            <span class="field-val">${c.provincia || 'N/A'}</span>
                        </div>
                        <div class="field-item">
                            <span class="field-label">NACIMIENTO</span>
                            <span class="field-val">${c.nacimiento || 'N/A'}</span>
                        </div>
                        <div class="field-item">
                            <span class="field-label">VENCE</span>
                            <span class="field-val">${c.vence || 'N/A'}</span>
                        </div>
                        <div class="field-item">
                            <span class="field-label">GÉNERO</span>
                            <span class="field-val">${c.genero || 'N/A'}</span>
                        </div>
                        <div class="field-item">
                            <span class="field-label">DISCORD</span>
                            <span class="field-val">${c.discord || 'N/A'}</span>
                        </div>
                    </div>

                    <div class="mrz-line">
                        <span>${(c.cedula || 'TT-0000').replace('-', '')}<<TIERRATICA</span>
                        <span>DOCUMENTO OFICIAL</span>
                    </div>
                </div>
            `).join('');
        }

        inputFilter.addEventListener('input', (e) => renderizar(e.target.value));
        renderizar();
    </script>
</body>
</html>
